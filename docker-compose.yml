version: "3.8"

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: cloudnet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudnet
      POSTGRES_PASSWORD: cloudnet_password
      POSTGRES_DB: cloudnet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudnet -d cloudnet_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cloudnet_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: cloudnet_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cloudnet_admin
      MINIO_ROOT_PASSWORD: cloudnet_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.backend
    container_name: cloudnet_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://cloudnet:cloudnet_password@postgres:5432/cloudnet_db
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "true"
      STORAGE_TYPE: "s3"
      SECRET_KEY: "cloudnet-sih-2026-national-weather-security-key-super-secure"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.frontend
    container_name: cloudnet_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  minio_data:
